name: setup-node

description: Setup Node.js and pnpm

runs:
  using: "composite"
  steps:
    - id: version
      name: Read the pnpm version from the package.json file
      shell: bash
      run: |
        pnpm=$(cat ./package.json | jq -c -r '.devEngines.packageManager.version')
        node=$(cat ./package.json | jq -c -r '.devEngines.runtime.version')
        echo "pnpm=$pnpm" >> "$GITHUB_OUTPUT"
        echo "node=$node" >> "$GITHUB_OUTPUT"
    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: ${{ steps.version.outputs.pnpm }}
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.version.outputs.node }}
        cache: "pnpm"
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
